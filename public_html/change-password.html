<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>makram | تغيير كلمة المرور</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tajawal', 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container { max-width: 440px; width: 100%; }
        .brand { text-align: center; margin-bottom: 28px; }
        .brand h1 { font-size: 38px; font-weight: 900; color: #fff; letter-spacing: 3px; }
        .brand p { color: #45A5C4; font-size: 13px; margin-top: 4px; }
        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, #45A5C422, #45A5C411);
            padding: 28px 24px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .user-avatar {
            width: 72px; height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, #45A5C4, #2E8BA8);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 14px;
            font-size: 28px; color: #fff;
            box-shadow: 0 8px 24px rgba(69,165,196,0.3);
        }
        .user-name {
            font-size: 22px; font-weight: 800; color: #f1f5f9;
            margin-bottom: 4px;
        }
        .user-username {
            font-size: 14px; color: #45A5C4; font-weight: 600;
            direction: ltr; display: inline-block;
            background: rgba(69,165,196,0.1);
            padding: 3px 14px; border-radius: 20px;
        }
        .card-body { padding: 28px 24px; }
        .form-group { margin-bottom: 20px; }
        .form-label {
            display: block; font-size: 13px; font-weight: 700;
            color: #94a3b8; margin-bottom: 8px;
        }
        .form-label i { margin-left: 6px; color: #45A5C4; }
        .input-wrapper {
            position: relative;
        }
        .form-input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 14px 16px;
            padding-left: 44px;
            font-size: 15px;
            color: #e2e8f0;
            font-family: 'Tajawal', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }
        .form-input:focus {
            border-color: #45A5C4;
            background: rgba(69,165,196,0.05);
            box-shadow: 0 0 0 4px rgba(69,165,196,0.1);
        }
        .form-input::placeholder { color: #475569; }
        .toggle-pass {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none; border: none;
            color: #64748b; font-size: 16px;
            cursor: pointer; padding: 4px;
            transition: color 0.2s;
        }
        .toggle-pass:hover { color: #45A5C4; }
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #45A5C4, #2E8BA8);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 15px;
            font-size: 16px;
            font-weight: 800;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(69,165,196,0.3);
        }
        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(69,165,196,0.4);
        }
        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .submit-btn i { margin-left: 8px; }
        .msg {
            text-align: center;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            margin-top: 16px;
            display: none;
        }
        .msg.error {
            display: block;
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.2);
            color: #fca5a5;
        }
        .msg.success {
            display: block;
            background: rgba(16,185,129,0.1);
            border: 1px solid rgba(16,185,129,0.2);
            color: #6ee7b7;
        }
        .loading {
            text-align: center;
            padding: 60px 24px;
            color: #94a3b8;
        }
        .loading i {
            font-size: 36px; color: #45A5C4;
            animation: spin 1s linear infinite;
            display: block; margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-page {
            text-align: center;
            padding: 48px 24px;
            color: #94a3b8;
        }
        .error-page i { font-size: 48px; color: #ef4444; margin-bottom: 16px; display: block; }
        .error-page h2 { font-size: 20px; font-weight: 800; color: #f1f5f9; margin-bottom: 8px; }
        .success-page {
            text-align: center;
            padding: 48px 24px;
        }
        .success-page .check-icon {
            width: 80px; height: 80px;
            border-radius: 50%;
            background: rgba(16,185,129,0.15);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            font-size: 36px; color: #10b981;
        }
        .success-page h2 { font-size: 22px; font-weight: 800; color: #f1f5f9; margin-bottom: 8px; }
        .success-page p { color: #64748b; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">
            <h1>makram</h1>
            <p>لجميع المطبوعات المتكاملة</p>
        </div>
        <div class="card" id="content">
            <div class="loading">
                <i class="fas fa-spinner"></i>
                <p>جاري التحميل...</p>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAGQ7WbksLIPpFT_58O4gsgkkOTB_NWiVk",
            authDomain: "ragab-a1dab.firebaseapp.com",
            projectId: "ragab-a1dab",
            storageBucket: "ragab-a1dab.firebasestorage.app",
            messagingSenderId: "835643523081",
            appId: "1:835643523081:web:1d97ec9d266dc735fff8d8"
        };
        if (!firebase.apps || firebase.apps.length === 0) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let _userData = null;
        let _docId = null;

        async function init() {
            const params = new URLSearchParams(window.location.search);
            const username = params.get('user');
            const content = document.getElementById('content');

            if (!username) {
                content.innerHTML = `<div class="error-page"><i class="fas fa-link-slash"></i><h2>رابط غير صالح</h2><p>لا يوجد اسم مستخدم في الرابط</p></div>`;
                return;
            }

            try {
                // Try to find user in Firestore
                const snap = await db.collection('users').where('username', '==', username).get();
                if (snap.empty) {
                    content.innerHTML = `<div class="error-page"><i class="fas fa-user-slash"></i><h2>المستخدم غير موجود</h2><p>لم يتم العثور على حساب بهذا الاسم</p></div>`;
                    return;
                }
                const doc = snap.docs[0];
                _userData = doc.data();
                _docId = doc.id;
                renderForm();
            } catch(e) {
                console.error(e);
                content.innerHTML = `<div class="error-page"><i class="fas fa-wifi"></i><h2>خطأ في الاتصال</h2><p>تعذر الاتصال بالسيرفر. حاول مرة أخرى.</p></div>`;
            }
        }

        function renderForm() {
            const content = document.getElementById('content');
            const initials = (_userData.name || _userData.username || '?').charAt(0).toUpperCase();
            content.innerHTML = `
                <div class="card-header">
                    <div class="user-avatar">${initials}</div>
                    <div class="user-name">${esc(_userData.name || _userData.username)}</div>
                    <div class="user-username">@${esc(_userData.username)}</div>
                </div>
                <div class="card-body">
                    <h3 style="font-size:16px;font-weight:800;color:#e2e8f0;margin-bottom:20px;text-align:center">
                        <i class="fas fa-key" style="color:#45A5C4;margin-left:8px"></i> تغيير كلمة المرور
                    </h3>
                    <form id="changeForm" onsubmit="handleSubmit(event)">
                        <div class="form-group">
                            <label class="form-label"><i class="fas fa-lock"></i> كلمة المرور الحالية</label>
                            <div class="input-wrapper">
                                <input type="password" id="oldPassword" class="form-input" placeholder="أدخل كلمة المرور الحالية" required>
                                <button type="button" class="toggle-pass" onclick="togglePass('oldPassword', this)"><i class="fas fa-eye"></i></button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label"><i class="fas fa-lock-open"></i> كلمة المرور الجديدة</label>
                            <div class="input-wrapper">
                                <input type="password" id="newPassword" class="form-input" placeholder="أدخل كلمة المرور الجديدة" required minlength="3">
                                <button type="button" class="toggle-pass" onclick="togglePass('newPassword', this)"><i class="fas fa-eye"></i></button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label"><i class="fas fa-check-double"></i> تأكيد كلمة المرور الجديدة</label>
                            <div class="input-wrapper">
                                <input type="password" id="confirmPassword" class="form-input" placeholder="أعد إدخال كلمة المرور الجديدة" required minlength="3">
                                <button type="button" class="toggle-pass" onclick="togglePass('confirmPassword', this)"><i class="fas fa-eye"></i></button>
                            </div>
                        </div>
                        <button type="submit" class="submit-btn" id="submitBtn">
                            <i class="fas fa-save"></i> تغيير كلمة المرور
                        </button>
                        <div class="msg" id="msgBox"></div>
                    </form>
                </div>
            `;
        }

        function togglePass(inputId, btn) {
            const inp = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (inp.type === 'password') {
                inp.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                inp.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        function showMsg(text, type) {
            const box = document.getElementById('msgBox');
            box.textContent = text;
            box.className = 'msg ' + type;
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const oldPass = document.getElementById('oldPassword').value;
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('submitBtn');

            // Validate old password
            if (oldPass !== _userData.password) {
                showMsg('كلمة المرور الحالية غير صحيحة', 'error');
                return;
            }
            if (newPass !== confirmPass) {
                showMsg('كلمة المرور الجديدة وتأكيدها غير متطابقتين', 'error');
                return;
            }
            if (newPass === oldPass) {
                showMsg('كلمة المرور الجديدة يجب أن تكون مختلفة عن الحالية', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحديث...';

            try {
                await db.collection('users').doc(_docId).update({ password: newPass, passwordChangedAt: new Date().toISOString() });
                // Show success
                document.getElementById('content').innerHTML = `
                    <div class="success-page">
                        <div class="check-icon"><i class="fas fa-check"></i></div>
                        <h2>تم تغيير كلمة المرور بنجاح</h2>
                        <p>يمكنك الآن تسجيل الدخول بكلمة المرور الجديدة</p>
                    </div>
                `;
            } catch(err) {
                console.error(err);
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> تغيير كلمة المرور';
                showMsg('فشل تحديث كلمة المرور. حاول مرة أخرى.', 'error');
            }
        }

        function esc(str) {
            if (!str) return '';
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        init();
    </script>
</body>
</html>
